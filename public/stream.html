<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Stream Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            gap: 20px;
        }

        .stream-container {
            flex: 3;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .log-container {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 5px;
            height: 500px;
            overflow-y: auto;
            padding: 10px;
        }

        #browser-stream {
            max-width: 100%;
            border: 1px solid #ddd;
            margin-top: 10px;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 6px;
            border-radius: 4px;
            font-size: 14px;
        }

        .info {
            background-color: #e3f2fd;
        }

        .error {
            background-color: #ffebee;
            color: #d32f2f;
        }

        .status {
            background-color: #f1f8e9;
            color: #388e3c;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #388e3c;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .status-indicator {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
        }

        .connected {
            background-color: #4caf50;
            color: white;
        }

        .disconnected {
            background-color: #9e9e9e;
            color: white;
        }

        .error-status {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>

<body>
    <h1>Browser Stream Viewer</h1>

    <div class="container">
        <div class="stream-container">
            <h2>Live Browser View</h2>
            <div id="status-indicator" class="status-indicator disconnected">Disconnected</div>
            <img id="browser-stream" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
                alt="Browser Stream">
            <div class="controls">
                <button id="start-stream">Start Stream</button>
                <button id="stop-stream" disabled>Stop Stream</button>
                <button id="take-screenshot">Take Screenshot</button>
            </div>
        </div>

        <div class="log-container" id="log-container">
            <h2>Event Log</h2>
            <!-- Log entries will be added here -->
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // DOM Elements
        const browserStreamImg = document.getElementById('browser-stream');
        const logContainer = document.getElementById('log-container');
        const startStreamBtn = document.getElementById('start-stream');
        const stopStreamBtn = document.getElementById('stop-stream');
        const takeScreenshotBtn = document.getElementById('take-screenshot');
        const statusIndicator = document.getElementById('status-indicator');

        // Variables
        let sessionId = null;
        let eventSource = null;
        let socket = null;
        let isConnected = false;

        // Initialize the page
        async function init() {
            try {
                // Generate a session ID
                sessionId = 'stream-' + Math.random().toString(36).substring(2, 15);

                // Connect to Socket.IO
                socket = io();
                socket.on('browser-screenshot', handleScreenshot);
                socket.on('stream-status', handleStreamStatus);
                socket.on('status-update', addLogEntry);

                // Add log entry
                addLogEntry({ event: 'init', message: 'Page initialized with session ID: ' + sessionId });
            } catch (error) {
                addLogEntry({ event: 'error', message: 'Initialization error: ' + error.message });
            }
        }

        // Handle Socket.IO screenshot events
        function handleScreenshot(data) {
            if (!isConnected) {
                // Only update from screenshots if not streaming
                browserStreamImg.src = 'data:image/png;base64,' + data.image;
                addLogEntry({ event: data.event, message: 'Screenshot received' });
            }
        }

        // Handle Socket.IO stream status events
        function handleStreamStatus(data) {
            addLogEntry({
                event: 'stream-' + data.status,
                message: data.message || 'Stream status: ' + data.status
            });

            updateStatusIndicator(data.status);
        }

        // Start the stream
        function startStream() {
            if (eventSource) {
                eventSource.close();
            }

            try {
                addLogEntry({ event: 'stream', message: 'Starting browser stream...' });

                // Create EventSource for SSE
                eventSource = new EventSource(`/browser-stream/${sessionId}`);

                // Handle connection open
                eventSource.onopen = () => {
                    isConnected = true;
                    startStreamBtn.disabled = true;
                    stopStreamBtn.disabled = false;
                    updateStatusIndicator('connected');
                    addLogEntry({ event: 'stream', message: 'Stream connection opened' });
                };

                // Handle incoming messages
                eventSource.onmessage = (event) => {
                    // Update image if data starts with data:image
                    if (event.data.startsWith('data:image')) {
                        browserStreamImg.src = event.data;
                    }
                };

                // Handle errors
                eventSource.onerror = (error) => {
                    addLogEntry({ event: 'error', message: 'Stream error occurred' });
                    stopStream();
                };

                // Handle specific events
                eventSource.addEventListener('connected', () => {
                    addLogEntry({ event: 'stream', message: 'Stream connected event received' });
                });
            } catch (error) {
                addLogEntry({ event: 'error', message: 'Error starting stream: ' + error.message });
            }
        }

        // Stop the stream
        function stopStream() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
                isConnected = false;
                startStreamBtn.disabled = false;
                stopStreamBtn.disabled = true;
                updateStatusIndicator('disconnected');
                addLogEntry({ event: 'stream', message: 'Stream stopped' });
            }
        }

        // Take a screenshot
        async function takeScreenshot() {
            try {
                addLogEntry({ event: 'screenshot', message: 'Requesting screenshot...' });
                const response = await fetch('/screenshot');
                const data = await response.json();

                if (data.success) {
                    addLogEntry({ event: 'screenshot', message: 'Screenshot requested successfully' });
                } else {
                    addLogEntry({ event: 'error', message: 'Screenshot error: ' + data.message });
                }
            } catch (error) {
                addLogEntry({ event: 'error', message: 'Error requesting screenshot: ' + error.message });
            }
        }

        // Add a log entry
        function addLogEntry(data) {
            const entry = document.createElement('div');
            entry.classList.add('log-entry');

            // Add appropriate class based on event type
            if (data.event === 'error') {
                entry.classList.add('error');
            } else if (data.event.startsWith('stream')) {
                entry.classList.add('status');
            } else {
                entry.classList.add('info');
            }

            // Format timestamp
            const timestamp = data.timestamp
                ? new Date(data.timestamp).toLocaleTimeString()
                : new Date().toLocaleTimeString();

            // Set content
            entry.textContent = `[${timestamp}] ${data.event}: ${data.message}`;

            // Add to container and scroll to bottom
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Update status indicator
        function updateStatusIndicator(status) {
            statusIndicator.className = 'status-indicator';
            statusIndicator.textContent = status.charAt(0).toUpperCase() + status.slice(1);

            if (status === 'connected') {
                statusIndicator.classList.add('connected');
            } else if (status === 'error') {
                statusIndicator.classList.add('error-status');
            } else {
                statusIndicator.classList.add('disconnected');
            }
        }

        // Set up event listeners
        startStreamBtn.addEventListener('click', startStream);
        stopStreamBtn.addEventListener('click', stopStream);
        takeScreenshotBtn.addEventListener('click', takeScreenshot);

        // Initialize the page when loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
