version: "3.8"

services:
  # Firebase emulator service
  firebase:
    build:
      context: .
      dockerfile: Dockerfile.firebase
    image: browser-assist-firebase:latest
    container_name: browser-assist-firebase
    ports:
      - "4000:4000" # Firebase emulator UI
      - "8080:8080" # Firestore
      - "9099:9099" # Auth
      - "9199:9199" # Storage
    volumes:
      - ./firebase-data:/app/firebase-data # For data persistence
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Server service (Deno backend)
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: browser-assist-server:latest
    container_name: browser-assist-server
    env_file:
      - server/.env
    environment:
      - FIREBASE_EMULATOR_HOST=browser-assist-firebase
      - MCP_SERVER_URL=http://playwright-sse-mcp-server:3003/mcp
    volumes:
      - ./src:/app/src
    depends_on:
      firebase:
        condition: service_healthy
      playwright-sse-mcp-server:
        condition: service_started
    networks:
      - app-network

  # UI service (React frontend)
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: browser-assist-ui:latest
    container_name: browser-assist-ui
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/localhost.pem:/etc/nginx/certs/localhost.pem
      - ./nginx/localhost-key.pem:/etc/nginx/certs/localhost-key.pem
    depends_on:
      - server
    networks:
      - app-network

  # Playwright SSE MCP server
  playwright-sse-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.sse
    image: mcp-playwright-sse-server:latest
    container_name: playwright-sse-mcp-server
    restart: ${RESTART_POLICY:-no}
    environment:
      - PORT=3003
      - USER_DATA_DIR=/app/user-data
    # Adding a volume for Playwright browser data persistence
    volumes:
      - ./mcp-playwright-sse-server/src:/app/src:ro # Mount source for development
      - playwright-user-data:/app/user-data # Persistent browser profiles
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  playwright-user-data: # For browser profile persistence
